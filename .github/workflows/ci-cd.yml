name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Scoped to the unit-test project rather than filtering across the solution.
      # global.json selects Microsoft.Testing.Platform, under which an assembly where every test is
      # filtered out is an error ("Zero tests ran", exit 8), not a no-op. The old
      # --filter "FullyQualifiedName!~Integration" excluded every test in Jira.Api.Test.Integration,
      # so the whole step failed however green the real tests were, and publish (needs: build) never
      # ran. ci.yml has no test step, which is why the tag path kept working and this one did not.
      - name: Test
        run: dotnet test Jira.Api.Test/Jira.Api.Test.csproj --no-build --configuration Release --verbosity normal

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack
        run: dotnet pack Jira.Api/Jira.Api.csproj --no-build --configuration Release --output ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
